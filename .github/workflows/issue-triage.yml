name: Triage new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Update issue with triage metadata
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const originalBody = issue.body ?? '';
            const text = `${issue.title}\n${originalBody}`.toLowerCase();

            const type = text.includes('bug') || text.includes('error') || text.includes('fail')
              ? 'bug'
              : text.includes('feature') || text.includes('enhancement') || text.includes('request')
                ? 'feature'
                : text.includes('documentation') || text.includes('docs')
                  ? 'documentation'
                  : text.includes('question') || text.includes('how ') || text.includes('?')
                    ? 'question'
                    : 'question';

            const metadata = [
              '',
              '',
              '---',
              '',
              '## Triage metadata',
              '',
              `- **Status:** needs-triage`,
              `- **Type:** ${type}`,
              `- **Opened by:** @${issue.user.login}`,
              `- **Opened at:** ${issue.created_at}`,
              ''
            ].join('\n');

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: originalBody + metadata
            });

            for (const label of ['needs-triage', type]) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: label === 'needs-triage' ? 'fbca04' : '1d76db'
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['needs-triage', type]
            });
